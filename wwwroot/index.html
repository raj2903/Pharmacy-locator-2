<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Locator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <header class="page-header">
        <h1>Pharmacy Locator</h1>
        <p>Find pharmacies near you by entering an address and search radius.</p>
    </header>

    <section class="form-section">
        <form id="searchForm">
            <div class="form-row">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="123 Main St" required>
            </div>
            <div class="form-row">
                <label for="zip">ZIP code</label>
                <input type="text" id="zip" name="zip" placeholder="12345" required>
            </div>
            <div class="form-row inline">
                <div>
                    <label for="radius">Radius</label>
                    <input type="number" id="radius" name="radius" value="5" min="0" step="0.5" required>
                </div>
                <div>
                    <label for="unit">Unit</label>
                    <select id="unit" name="unit">
                        <option value="mi">Miles</option>
                        <option value="km">Kilometers</option>
                    </select>
                </div>
                <div class="button-wrapper">
                    <button type="submit" id="searchButton">Search Pharmacies</button>
                </div>
            </div>
            <div id="formMessage" class="message" role="alert"></div>
        </form>
    </section>

    <section class="content">
        <div id="map" aria-label="Map showing pharmacies"></div>
        <aside class="sidebar" aria-label="Pharmacy results">
            <div class="sidebar-header">
                <h2>Nearby Pharmacies</h2>
                <div id="loadingIndicator" class="loading hidden">Loading...</div>
            </div>
            <div id="listMessage" class="message"></div>
            <ul id="pharmacyList"></ul>
        </aside>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js" integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/app.js"></script>
</body>
</html>
